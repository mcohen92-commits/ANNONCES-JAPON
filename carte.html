// --- Chargement des favoris partagés (même bin jsonbin que la page principale) ---
const JSONBIN_ID = "6a96dfaff5f4af5e295ce46d";
const JSONBIN_KEY = "$2a$10$qV.38Oa9/xSdVekJotGXT.x3wqHqaEFsSQcJYDtCYpI7amfC4leHq";
const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_ID;

const map = L.map('map').setView([36.2, 138.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

function scoreColor(total) {
  if (total >= 60) return "#4a7a5c";
  if (total >= 45) return "#c98a3a";
  if (total >= 25) return "#b8462f";
  return "#8a8a86";
}

const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 40 });
let favoritesData = {};

function renderMarkers() {
  clusterGroup.clearLayers();
  const onlyFavs = document.getElementById("favOnlyToggle").checked;

  DATA.forEach(r => {
    const favs = favoritesData[r.n] || [];
    if (onlyFavs && favs.length === 0) return;

    const both = favs.includes("michael") && favs.includes("celine");
    const col = both ? "#b7924a" : scoreColor(r.total || 0); // doré si favori des 2
    const priceLabel = r.prix_eur ? (r.prix_eur.toLocaleString("fr-FR") + " €") : "?";
    const surfLabel = r.surf ? (r.surf + " m²") : "?";
    const favLabel = favs.length ? (" · ❤ " + favs.map(f => f === "michael" ? "Michael" : "Céline").join(", ")) : "";

    const icon = L.divIcon({
      className: "",
      html: `<div style="background:${col};color:#fff;border:2px solid #fff;border-radius:50%;
                          width:30px;height:30px;display:flex;align-items:center;justify-content:center;
                          font-size:0.72rem;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,0.35);
                          ${both ? "outline:2px solid #b7924a;outline-offset:2px;" : ""}">${r.n}</div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    const marker = L.marker([r.lat, r.lon], { icon: icon });

    marker.bindTooltip(`${priceLabel} / ${surfLabel}${favLabel}`, {
      permanent: false,
      direction: "top",
      offset: [0, -12],
      className: "pin-label"
    });

    marker.bindPopup(`
      <div class="popup-title">Bien n°${r.n} — Score ${r.total}/100${both ? " · ❤ Coup de cœur commun !" : ""}</div>
      <div>${r.loc}</div>
      <div style="margin-top:4px;"><strong>${priceLabel}</strong> · ${surfLabel}</div>
      ${favs.length ? `<div style="margin-top:4px;">${favs.map(f => "❤ " + (f === "michael" ? "Michael" : "Céline")).join(" · ")}</div>` : ""}
      ${r.approx ? `<div style="margin-top:4px;font-size:0.7rem;color:#999;">⚠️ Position approximative (plusieurs annonces au même quartier, écartées visuellement)</div>` : ""}
      <a class="popup-link" href="${r.lien}" target="_blank" rel="noopener">Voir l'annonce ↗</a>
    `);

    clusterGroup.addLayer(marker);
  });
  map.addLayer(clusterGroup);
}

async function loadFavorites() {
  try {
    const res = await fetch(JSONBIN_URL + "/latest", { headers: { "X-Access-Key": JSONBIN_KEY } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    favoritesData = (data.record && data.record.favorites) || {};
  } catch (e) {
    console.warn("Impossible de charger les favoris partagés :", e);
    favoritesData = {};
  }
  renderMarkers();
}

document.getElementById("favOnlyToggle").addEventListener("change", renderMarkers);

loadFavorites();
</script>
