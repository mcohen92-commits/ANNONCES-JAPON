<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte des annonces - Japon</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  :root {
    --indigo: #2c4a5e;
    --indigo-dark: #1a2f3d;
    --vermillion: #b8462f;
    --paper: #f6f2e9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header {
    background: var(--indigo-dark);
    color: var(--paper);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 { margin: 0; font-size: 1.1rem; }
  header a {
    color: var(--paper);
    font-size: 0.82rem;
    text-decoration: underline;
  }
  #map { position: absolute; top: 56px; bottom: 0; left: 0; right: 0; }
  .pin-label {
    background: #fffdf8;
    border: 1px solid #d9d0bb;
    border-radius: 8px;
    padding: 3px 7px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--indigo);
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .leaflet-popup-content { font-size: 0.85rem; line-height: 1.4; }
  .popup-title { font-weight: 700; color: var(--indigo); margin-bottom: 4px; }
  .popup-link {
    display: inline-block;
    margin-top: 6px;
    background: var(--indigo);
    color: #fff !important;
    padding: 5px 10px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <h1>🗾 Carte des annonces immobilières</h1>
  <label style="display:flex; align-items:center; gap:6px; font-size:0.82rem; color:var(--paper); cursor:pointer;">
    <input type="checkbox" id="favOnlyToggle" style="width:auto;">
    ❤️ Favoris uniquement
  </label>
  <span style="font-size:0.72rem; color:#cdd8d4;">(🗑️ les annonces écartées ne sont jamais affichées ici)</span>
  <a href="index.html">← Retour au tableau</a>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const DATA = [{"n": 1, "id": "c864770115", "lat": 34.402, "lon": 135.313, "loc": "Osaka-fu, Izumisano-shi, Ichibanishi 1-chōme", "prix_eur": 49080, "surf": 85.05, "lien": "https://akiyaair.com/akiyas/68f032d2951e1400d2ce73f7", "total": 63}, {"n": 2, "id": "db9343ad44", "lat": 32.7503, "lon": 129.8779, "loc": "Nagasaki-ken, Nagasaki-shi, Ōte 3", "prix_eur": 48466, "surf": 93.89, "lien": "https://suumo.jp/chukoikkodate/nagasaki/sc_nagasaki/nc_20841966/", "total": 54}, {"n": 3, "id": "19f0628681", "lat": 35.4941, "lon": 133.2627, "loc": "Tottori-ken, Yonago-shi, Ōshinozu-chō", "prix_eur": 52147, "surf": 157.1, "lien": "https://www.homes.co.jp/kodate/b-1313620000424/", "total": 54}, {"n": 4, "id": "d2ea946ee1", "lat": 35.455, "lon": 136.68, "loc": "Gifu-ken, Motosu-shi, Monju", "prix_eur": 84663, "surf": 159.12, "lien": "https://suumo.jp/chukoikkodate/gifu/sc_motosu/nc_79167307/", "total": 49}, {"n": 5, "id": "a3878e1ae4", "lat": 34.427, "lon": 135.3195, "loc": "Osaka-fu, Izumisano-shi, Hineno", "prix_eur": 67485, "surf": 220.5, "lien": "https://www.homes.co.jp/kodate/b-1149800001280/", "total": 48}, {"n": 6, "id": "6e83cabbc3", "lat": 34.95, "lon": 135.935, "loc": "Shiga-ken, Ōtsu-shi, Inazu 3", "prix_eur": 52147, "surf": 125.03, "lien": "https://suumo.jp/chukoikkodate/shiga/sc_otsu/nc_20699826/", "total": 39}, {"n": 7, "id": "1f37dfcea4", "lat": 33.7833, "lon": 130.7167, "loc": "Fukuoka-ken, Kurate-machi, Ninobu", "prix_eur": 36196, "surf": 107.48, "lien": "https://akiyaair.com/akiyas/69ee0032c71c4016135c7be7/", "total": 33}, {"n": 8, "id": "96180dbbd6", "lat": 34.97, "lon": 139.085, "loc": "Shizuoka-ken, Itō-shi, Oka", "prix_eur": 47853, "surf": 87.34, "lien": "https://akiyaair.com/akiyas/6a047bd2060ba69e98e4499b/", "total": 32}, {"n": 9, "id": "caed881f01", "lat": 33.75, "lon": 130.65, "loc": "Fukuoka-ken, Miyawaka-shi, Ryūtoku", "prix_eur": 60123, "surf": 131.36, "lien": "https://akiyaair.com/akiyas/68f03f6b951e1400d2cea88f/", "total": 32}, {"n": 10, "id": "7bb91db 0", "lat": 35.475, "lon": 135.325, "loc": "Kyoto-fu, Maizuru-shi, Shirasugi", "prix_eur": 54601, "surf": 152.82, "lien": "https://www.athome.co.jp/kodate/6991392510/", "total": 24}, {"n": 20, "id": "9177734988", "lat": 35.37, "lon": 135.22, "loc": "Kyoto-fu, Ayabe-shi, Jukura Naka-machi", "prix_eur": 35583, "surf": 206.78, "lien": "https://www.kyoto-iju.jp/akiya_bank/me-098/", "total": 16}];

// --- Chargement des favoris partagés (même bin jsonbin que la page principale) ---
const JSONBIN_ID = "6a96dfaff5f4af5e295ce46d";
const JSONBIN_KEY = "$2a$10$qV.38Oa9/xSdVekJotGXT.x3wqHqaEFsSQcJYDtCYpI7amfC4leHq";
const JSONBIN_URL = "https://api.jsonbin.io/v3/b/" + JSONBIN_ID;

const map = L.map('map').setView([36.2, 138.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

function scoreColor(total) {
  if (total >= 60) return "#4a7a5c";
  if (total >= 45) return "#c98a3a";
  if (total >= 25) return "#b8462f";
  return "#8a8a86";
}

const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 40 });
let favoritesData = {};
let trashData = {};

function renderMarkers() {
  clusterGroup.clearLayers();
  const onlyFavs = document.getElementById("favOnlyToggle").checked;

  DATA.forEach(r => {
    if (trashData[r.id]) return; // annonces écartées TOUJOURS exclues de la carte
    const favs = favoritesData[r.id] || [];
    if (onlyFavs && favs.length === 0) return;

    const both = favs.includes("michael") && favs.includes("celine");
    const col = both ? "#b7924a" : scoreColor(r.total || 0); // doré si favori des 2
    const priceLabel = r.prix_eur ? (r.prix_eur.toLocaleString("fr-FR") + " €") : "?";
    const surfLabel = r.surf ? (r.surf + " m²") : "?";
    const favLabel = favs.length ? (" · ❤ " + favs.map(f => f === "michael" ? "Michael" : "Céline").join(", ")) : "";

    const icon = L.divIcon({
      className: "",
      html: `<div style="background:${col};color:#fff;border:2px solid #fff;border-radius:50%;
                          width:30px;height:30px;display:flex;align-items:center;justify-content:center;
                          font-size:0.72rem;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,0.35);
                          ${both ? "outline:2px solid #b7924a;outline-offset:2px;" : ""}">${r.n}</div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    const marker = L.marker([r.lat, r.lon], { icon: icon });

    marker.bindTooltip(`${priceLabel} / ${surfLabel}${favLabel}`, {
      permanent: false,
      direction: "top",
      offset: [0, -12],
      className: "pin-label"
    });

    marker.bindPopup(`
      <div class="popup-title">Bien n°${r.n} — Score ${r.total}/100${both ? " · ❤ Coup de cœur commun !" : ""}</div>
      <div>${r.loc}</div>
      <div style="margin-top:4px;"><strong>${priceLabel}</strong> · ${surfLabel}</div>
      ${favs.length ? `<div style="margin-top:4px;">${favs.map(f => "❤ " + (f === "michael" ? "Michael" : "Céline")).join(" · ")}</div>` : ""}
      ${r.approx ? `<div style="margin-top:4px;font-size:0.7rem;color:#999;">⚠️ Position approximative (plusieurs annonces au même quartier, écartées visuellement)</div>` : ""}
      <a class="popup-link" href="${r.lien}" target="_blank" rel="noopener">Voir l'annonce ↗</a>
    `);

    clusterGroup.addLayer(marker);
  });
  map.addLayer(clusterGroup);
}

async function loadFavorites() {
  try {
    const res = await fetch(JSONBIN_URL + "/latest", { headers: { "X-Access-Key": JSONBIN_KEY } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    favoritesData = (data.record && data.record.favorites) || {};
    trashData = (data.record && data.record.trash) || {};
  } catch (e) {
    console.warn("Impossible de charger les favoris/écartés partagés :", e);
    favoritesData = {};
    trashData = {};
  }
  renderMarkers();
}

document.getElementById("favOnlyToggle").addEventListener("change", renderMarkers);

loadFavorites();
</script>

</body>
</html>
